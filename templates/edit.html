<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <title>Редактировать: {{ movie.title }}</title>
    <style>
        body { font-family: sans-serif; background: #121212; color: #fff; padding: 20px; margin: 0; min-height: 100vh; box-sizing: border-box; }
        form { position: relative; z-index: 1; max-width: 500px; margin: 0 auto; background: rgba(30, 30, 30, 0.9); backdrop-filter: blur(10px); padding: 30px; border-radius: 8px; display: flex; flex-direction: column; gap: 15px; border: 1px solid rgba(255, 255, 255, 0.08); }
        input, textarea { padding: 10px; border-radius: 4px; border: 1px solid #333; background: #2a2a2a; color: white; }
        button { padding: 12px; background: #f0ad4e; color: white; border: none; border-radius: 4px; cursor: pointer; font-size: 16px; }
        .back { position: relative; z-index: 1; display: block; text-align: center; color: #aaa; margin-top: 20px; text-decoration: none; }
    </style>
</head>
<body>
    <form method="post" action="/movie/{{ movie.id }}/edit" enctype="multipart/form-data">
        <h2>Редактирование фильма</h2>

        <input type="text" name="title" value="{{ movie.title }}" required>
        <input type="number" name="year" value="{{ movie.year }}" required>
        <input type="text" name="genre" value="{{ movie.genre }}" required>

        <label>Текущий постер:</label>
        {% if movie.poster_path %}
            <img src="{{ movie.poster_path }}" id="poster-preview" style="height: 100px; object-fit: contain;">
        {% endif %}
        <label>Заменить постер (оставь пустым, чтобы не менять):</label>
        <input type="file" name="poster" accept="image/*">

        <label>Текущее видео:</label>
        {% if movie.video_path %}
            <span style="color: #4caf50;">Видео загружено</span>
        {% endif %}
        <label>Заменить видео (оставь пустым, чтобы не менять):</label>
        <input type="file" name="video" accept="video/*">

        <textarea name="description" rows="5">{{ movie.description or '' }}</textarea>

        <button type="submit">Сохранить изменения</button>
    </form>

    <a href="/movie/{{ movie.id }}" class="back">← Отмена</a>

    <script>
      (() => {
        // 1. Кинематографичный фон: лучи проектора и пылинки
        const canvas = document.createElement('canvas');
        canvas.style.cssText = 'position:fixed;inset:0;width:100vw;height:100vh;z-index:0;pointer-events:none;';
        document.body.prepend(canvas);
        const ctx = canvas.getContext('2d');

        let width, height, dpr, time = 0;
        const mouse = { x: innerWidth * 0.5, y: innerHeight * 0.3, tx: innerWidth * 0.5, ty: innerHeight * 0.3 };

        window.addEventListener('mousemove', (e) => {
          mouse.tx = e.clientX;
          mouse.ty = e.clientY;
        });

        function resize() {
          dpr = Math.min(window.devicePixelRatio || 1, 2);
          width = innerWidth;
          height = innerHeight;
          canvas.width = width * dpr;
          canvas.height = height * dpr;
          ctx.scale(dpr, dpr);
        }
        window.addEventListener('resize', resize);
        resize();

        const palette = [
          [245, 158, 11],
          [251, 191, 36],
          [225, 29, 72],
          [250, 245, 235]
        ];

        const dustMotes = Array.from({ length: 85 }, () => {
          const c = palette[Math.floor(Math.random() * palette.length)];
          const depth = Math.random() * 0.85 + 0.15;
          return {
            x: Math.random() * width,
            y: Math.random() * height,
            vx: (Math.random() - 0.5) * 0.4 * depth,
            vy: (Math.random() - 0.5) * 0.35 * depth - 0.12,
            r: (Math.random() * 2.4 + 0.6) * depth,
            c,
            a: Math.random() * 0.55 + 0.15,
            phase: Math.random() * Math.PI * 2
          };
        });

        function animate() {
          time++;
          ctx.clearRect(0, 0, width, height);

          mouse.x += (mouse.tx - mouse.x) * 0.06;
          mouse.y += (mouse.ty - mouse.y) * 0.06;

          [
            { originX: width * 0.25, angle: 0.22 + Math.sin(time * 0.008) * 0.06, spread: 260, color: 'rgba(245, 158, 11, 0.055)' },
            { originX: width * 0.72, angle: -0.25 + Math.cos(time * 0.007) * 0.07, spread: 320, color: 'rgba(225, 29, 72, 0.045)' }
          ].forEach((b) => {
            const endX = b.originX + Math.sin(b.angle) * height + (mouse.x - width * 0.5) * 0.15;
            const grad = ctx.createLinearGradient(b.originX, 0, endX, height);
            grad.addColorStop(0, b.color);
            grad.addColorStop(1, 'rgba(0, 0, 0, 0)');
            ctx.beginPath();
            ctx.moveTo(b.originX - 40, -20);
            ctx.lineTo(b.originX + 40, -20);
            ctx.lineTo(endX + b.spread, height + 20);
            ctx.lineTo(endX - b.spread, height + 20);
            ctx.closePath();
            ctx.fillStyle = grad;
            ctx.fill();
          });

          const spotlight = ctx.createRadialGradient(mouse.x, mouse.y, 0, mouse.x, mouse.y, 360);
          spotlight.addColorStop(0, 'rgba(245, 158, 11, 0.1)');
          spotlight.addColorStop(0.5, 'rgba(225, 29, 72, 0.04)');
          spotlight.addColorStop(1, 'rgba(0, 0, 0, 0)');
          ctx.fillStyle = spotlight;
          ctx.fillRect(0, 0, width, height);

          for (let i = 0; i < dustMotes.length; i++) {
            const m = dustMotes[i];
            m.phase += 0.022;
            m.x += m.vx + Math.sin(m.phase) * 0.16;
            m.y += m.vy;

            if (m.x < -20) m.x = width + 20;
            if (m.x > width + 20) m.x = -20;
            if (m.y < -20) m.y = height + 20;
            if (m.y > height + 20) m.y = -20;

            const dx = m.x - mouse.x;
            const dy = m.y - mouse.y;
            const dist = Math.hypot(dx, dy);
            if (dist < 180 && dist > 0) {
              const force = (180 - dist) / 180;
              m.x += (dx / dist) * force * 1.5;
              m.y += (dy / dist) * force * 1.5;
            }

            const twinkle = m.a * (0.7 + Math.sin(m.phase * 1.3) * 0.3);
            ctx.beginPath();
            ctx.arc(m.x, m.y, m.r, 0, Math.PI * 2);
            ctx.fillStyle = `rgba(${m.c[0]}, ${m.c[1]}, ${m.c[2]}, ${twinkle})`;
            ctx.fill();
          }

          requestAnimationFrame(animate);
        }
        animate();

        // 2. Мгновенное превью нового постера при выборе файла
        const posterInput = document.querySelector('input[name="poster"]');
        if (posterInput) {
          posterInput.addEventListener('change', () => {
            const file = posterInput.files[0];
            if (!file) return;
            let img = document.getElementById('poster-preview');
            if (!img) {
              img = document.createElement('img');
              img.id = 'poster-preview';
              img.style.cssText = 'height: 100px; object-fit: contain;';
              posterInput.before(img);
            }
            img.src = URL.createObjectURL(file);
          });
        }
      })();
    </script>
</body>
</html>
