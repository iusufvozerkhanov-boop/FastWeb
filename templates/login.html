<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>🔐 Вход в кинозал — FastKino</title>
    <link rel="stylesheet" href="{{ url_for('static', path='/style.css') }}?v=2">
    <style>
        .auth-stage {
            width: min(100% - 2.5rem, 480px);
            margin: 6vh auto 0;
            position: relative;
            z-index: 2;
        }

        .auth-card {
            background: rgba(18, 16, 24, 0.76);
            backdrop-filter: blur(28px) saturate(170%);
            -webkit-backdrop-filter: blur(28px) saturate(170%);
            border: 1px solid rgba(255, 255, 255, 0.14);
            border-radius: 28px;
            padding: clamp(2rem, 5vw, 3rem);
            box-shadow:
                0 35px 90px -20px rgba(0, 0, 0, 0.9),
                0 0 65px -15px rgba(245, 158, 11, 0.2),
                inset 0 1px 0 rgba(255, 255, 255, 0.2);
            text-align: center;
            animation: cardAppear 0.8s var(--ease-out-expo) both;
        }

        .vip-badge {
            display: inline-flex;
            align-items: center;
            gap: 0.5rem;
            font-family: var(--font-mono);
            font-size: 0.72rem;
            letter-spacing: 0.15em;
            text-transform: uppercase;
            color: var(--accent-amber);
            background: rgba(245, 158, 11, 0.1);
            border: 1px solid rgba(245, 158, 11, 0.3);
            padding: 0.42rem 1rem;
            border-radius: 9999px;
            margin-bottom: 1.5rem;
        }

        .auth-card h2 {
            font-size: clamp(1.85rem, 3.5vw, 2.4rem);
            font-weight: 600;
            letter-spacing: -0.03em;
            color: var(--ink-white);
            margin-bottom: 0.75rem;
        }

        .auth-card h2 em {
            font-family: var(--font-serif);
            font-style: italic;
            font-weight: 400;
            color: var(--accent-amber);
        }

        .auth-sub {
            font-size: 0.98rem;
            line-height: 1.6;
            color: var(--ink-secondary);
            margin-bottom: 2rem;
        }

        .auth-form {
            display: flex;
            flex-direction: column;
            gap: 1.25rem;
            text-align: left;
        }

        .pass-wrapper {
            position: relative;
            display: flex;
            align-items: center;
        }

        .cinema-input {
            width: 100%;
            font-family: var(--font-sans);
            font-size: 1.05rem;
            color: var(--ink-white);
            background: rgba(8, 7, 12, 0.82);
            border: 1px solid var(--border-strong);
            border-radius: 16px;
            padding: 1.05rem 3.2rem 1.05rem 1.35rem;
            outline: none;
            box-shadow: inset 0 3px 8px rgba(0, 0, 0, 0.65);
            transition: border-color 0.3s ease, box-shadow 0.3s ease;
        }

        .cinema-input::placeholder {
            color: var(--ink-muted);
        }

        .cinema-input:focus {
            border-color: var(--accent-gold);
            box-shadow:
                0 0 0 4px rgba(245, 158, 11, 0.16),
                0 0 30px -5px rgba(245, 158, 11, 0.3),
                inset 0 3px 8px rgba(0, 0, 0, 0.65);
        }

        .toggle-pass {
            position: absolute;
            right: 1rem;
            background: none;
            border: none;
            color: var(--ink-muted);
            font-size: 1.15rem;
            cursor: pointer;
            padding: 0.35rem;
            transition: color 0.2s ease;
        }

        .toggle-pass:hover {
            color: var(--accent-amber);
        }

        .btn-back {
            background: rgba(255, 255, 255, 0.05);
            border-color: var(--border-strong);
            box-shadow: none;
        }

        .btn-back:hover {
            background: rgba(255, 255, 255, 0.12);
            box-shadow: 0 12px 30px -10px rgba(0, 0, 0, 0.6);
        }
    </style>
</head>
<body>

    <div class="header">
        <h1>🎬 Мой Кинозал</h1>
        <a href="/" class="btn btn-back">← В кинозал</a>
    </div>

    <main class="auth-stage">
        <div class="auth-card">
            <div class="vip-badge">● DIRECTOR'S BOOTH · VIP ACCESS</div>
            <h2>Доступ в <em>аппаратную</em></h2>
            <p class="auth-sub">
                Введите пароль администратора, чтобы открывать премьеры и добавлять новые фильмы в коллекцию.
            </p>

            <form method="post" action="/login" class="auth-form">
                <div class="pass-wrapper">
                    <input
                        type="password"
                        id="admin-password"
                        name="password"
                        class="cinema-input"
                        placeholder="Введите пароль доступа..."
                        required
                        autofocus
                    >
                    <button type="button" class="toggle-pass" id="toggle-pass-btn" title="Показать/скрыть пароль">👁</button>
                </div>

                <button type="submit" class="btn" style="width: 100%; padding: 1.05rem;">
                    Войти в систему →
                </button>
            </form>
        </div>
    </main>

    <script>
      (() => {
        // Показать / скрыть пароль
        const passInput = document.getElementById('admin-password');
        const toggleBtn = document.getElementById('toggle-pass-btn');
        toggleBtn.addEventListener('click', () => {
          const isPass = passInput.type === 'password';
          passInput.type = isPass ? 'text' : 'password';
          toggleBtn.style.color = isPass ? '#fbbf24' : '';
        });

        // Кинематографичный фон: лучи проектора и пылинки
        const canvas = document.createElement('canvas');
        canvas.id = 'cinema-bg';
        document.documentElement.prepend(canvas);
        const ctx = canvas.getContext('2d');

        let width, height, dpr, time = 0;
        const mouse = { x: innerWidth * 0.5, y: innerHeight * 0.3, tx: innerWidth * 0.5, ty: innerHeight * 0.3 };
        window.addEventListener('mousemove', (e) => { mouse.tx = e.clientX; mouse.ty = e.clientY; });

        function resize() {
          dpr = Math.min(window.devicePixelRatio || 1, 2);
          width = innerWidth;
          height = innerHeight;
          canvas.width = width * dpr;
          canvas.height = height * dpr;
          ctx.scale(dpr, dpr);
        }
        window.addEventListener('resize', resize);
        resize();

        const palette = [[245, 158, 11], [251, 191, 36], [225, 29, 72], [250, 245, 235]];
        const dustMotes = Array.from({ length: 85 }, () => {
          const c = palette[Math.floor(Math.random() * palette.length)];
          const depth = Math.random() * 0.85 + 0.15;
          return {
            x: Math.random() * width,
            y: Math.random() * height,
            vx: (Math.random() - 0.5) * 0.4 * depth,
            vy: (Math.random() - 0.5) * 0.35 * depth - 0.12,
            r: (Math.random() * 2.5 + 0.6) * depth,
            c,
            a: Math.random() * 0.55 + 0.15,
            phase: Math.random() * Math.PI * 2
          };
        });

        function animate() {
          time++;
          ctx.clearRect(0, 0, width, height);
          mouse.x += (mouse.tx - mouse.x) * 0.06;
          mouse.y += (mouse.ty - mouse.y) * 0.06;

          [
            { originX: width * 0.25, angle: 0.22 + Math.sin(time * 0.008) * 0.06, spread: 260, color: 'rgba(245, 158, 11, 0.055)' },
            { originX: width * 0.72, angle: -0.25 + Math.cos(time * 0.007) * 0.07, spread: 320, color: 'rgba(225, 29, 72, 0.045)' }
          ].forEach((b) => {
            const endX = b.originX + Math.sin(b.angle) * height + (mouse.x - width * 0.5) * 0.15;
            const grad = ctx.createLinearGradient(b.originX, 0, endX, height);
            grad.addColorStop(0, b.color);
            grad.addColorStop(1, 'rgba(0, 0, 0, 0)');
            ctx.beginPath();
            ctx.moveTo(b.originX - 40, -20);
            ctx.lineTo(b.originX + 40, -20);
            ctx.lineTo(endX + b.spread, height + 20);
            ctx.lineTo(endX - b.spread, height + 20);
            ctx.closePath();
            ctx.fillStyle = grad;
            ctx.fill();
          });

          const spotlight = ctx.createRadialGradient(mouse.x, mouse.y, 0, mouse.x, mouse.y, 360);
          spotlight.addColorStop(0, 'rgba(245, 158, 11, 0.11)');
          spotlight.addColorStop(0.5, 'rgba(225, 29, 72, 0.04)');
          spotlight.addColorStop(1, 'rgba(0, 0, 0, 0)');
          ctx.fillStyle = spotlight;
          ctx.fillRect(0, 0, width, height);

          for (let i = 0; i < dustMotes.length; i++) {
            const m = dustMotes[i];
            m.phase += 0.022;
            m.x += m.vx + Math.sin(m.phase) * 0.16;
            m.y += m.vy;
            if (m.x < -20) m.x = width + 20;
            if (m.x > width + 20) m.x = -20;
            if (m.y < -20) m.y = height + 20;
            if (m.y > height + 20) m.y = -20;

            const twinkle = m.a * (0.7 + Math.sin(m.phase * 1.3) * 0.3);
            ctx.beginPath();
            ctx.arc(m.x, m.y, m.r, 0, Math.PI * 2);
            ctx.fillStyle = `rgba(${m.c[0]}, ${m.c[1]}, ${m.c[2]}, ${twinkle})`;
            ctx.fill();
          }
          requestAnimationFrame(animate);
        }
        animate();
      })();
    </script>

</body>
</html>
